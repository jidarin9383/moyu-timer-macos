<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pauseFishBody" x1="20" y1="20" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="pauseFishFin" x1="75" y1="35" x2="115" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Sleepy Zs / Bubble -->
  <circle cx="16" cy="34" r="3.5" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.1" opacity="0.8" />
  <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#0D9488" opacity="0.85">z</text>
  <text x="21" y="15" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#0D9488" opacity="0.65">Z</text>

  <!-- Tail Fin (Caudal) - Drooping slightly in sleep -->
  <path d="M78 48 C 87 36, 104 30, 112 36 C 114 40, 106 48, 112 58 C 115 63, 108 71, 96 66 C 87 61, 81 54, 78 48 Z" fill="url(#pauseFishFin)" stroke="#EA580C" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Dorsal Fin (Top) - Relaxed -->
  <path d="M46 30 C 53 23, 66 24, 72 30 C 65 31, 56 32, 46 30 Z" fill="url(#pauseFishFin)" stroke="#EA580C" stroke-width="1.2" />

  <!-- Pelvic Fin (Bottom) -->
  <path d="M52 66 C 56 73, 66 74, 69 68 C 64 65, 58 65, 52 66 Z" fill="url(#pauseFishFin)" stroke="#EA580C" stroke-width="1.2" />

  <!-- Main Body Silhouette -->
  <path d="M24 48 C 24 33, 44 27, 68 30 C 83 32, 86 47, 84 54 C 80 65, 62 70, 44 68 C 29 67, 24 58, 24 48 Z" fill="url(#pauseFishBody)" stroke="#9A3412" stroke-width="1.8" />

  <!-- Soft Warm Belly Curve -->
  <path d="M30 55 C 34 64, 52 68, 70 63 C 62 58, 42 54, 30 55 Z" fill="#FED7AA" opacity="0.9" />

  <!-- Pectoral Fin (Relaxed) -->
  <path d="M44 53 C 41 60, 47 69, 56 69 C 59 68, 60 63, 56 59 C 53 56, 49 54, 44 53 Z" fill="#FDBA74" stroke="#EA580C" stroke-width="1.3" />

  <!-- Sleepy Closed Eye: Gentle arc (⌒) -->
  <path d="M31 42 C 33 37, 39 37, 42 42" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Cute little sleep blush -->
  <ellipse cx="38" cy="49" rx="4.5" ry="2.5" fill="#FB7185" opacity="0.45" />

  <!-- Gentle peaceful smile -->
  <path d="M24 49 Q 27 51 25 53" stroke="#9A3412" stroke-width="1.5" stroke-linecap="round" fill="none" />
</svg>
