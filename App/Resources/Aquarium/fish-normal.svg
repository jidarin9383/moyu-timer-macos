<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="normFishBody" x1="20" y1="20" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="normFishFin" x1="75" y1="35" x2="115" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.65" />
    </linearGradient>
  </defs>

  <!-- Bubbles -->
  <circle cx="16" cy="28" r="4.5" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.2" opacity="0.85" />
  <circle cx="14.5" cy="26.5" r="1.3" fill="#FFFFFF" />
  <circle cx="28" cy="15" r="2.8" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1" opacity="0.8" />
  <circle cx="27" cy="14" r="0.8" fill="#FFFFFF" />

  <!-- Tail Fin (Caudal) - Clean curved lobes -->
  <path d="M78 46 C 88 32, 106 24, 114 30 C 117 34, 108 44, 115 54 C 118 59, 112 68, 98 62 C 88 58, 82 52, 78 46 Z" fill="url(#normFishFin)" stroke="#EA580C" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Dorsal Fin (Top) -->
  <path d="M46 27 C 54 18, 68 19, 74 27 C 66 28, 56 29, 46 27 Z" fill="url(#normFishFin)" stroke="#EA580C" stroke-width="1.2" />

  <!-- Pelvic Fin (Bottom) -->
  <path d="M52 64 C 56 73, 67 74, 70 67 C 65 64, 58 63, 52 64 Z" fill="url(#normFishFin)" stroke="#EA580C" stroke-width="1.2" />

  <!-- Main Body Silhouette - Smooth, friendly, clean -->
  <path d="M24 45 C 24 30, 44 24, 68 27 C 83 29, 86 44, 84 51 C 80 62, 62 67, 44 65 C 29 64, 24 55, 24 45 Z" fill="url(#normFishBody)" stroke="#9A3412" stroke-width="1.8" />

  <!-- Soft Warm Belly Curve -->
  <path d="M30 52 C 34 61, 52 65, 70 60 C 62 55, 42 51, 30 52 Z" fill="#FED7AA" opacity="0.9" />

  <!-- Pectoral Fin (Front Arm) -->
  <path d="M44 49 C 41 57, 47 67, 57 68 C 60 67, 61 62, 57 57 C 54 53, 49 50, 44 49 Z" fill="#FDBA74" stroke="#EA580C" stroke-width="1.4" />

  <!-- Expressive Big Inquisitive Eye -->
  <ellipse cx="37" cy="38" rx="8.5" ry="9" fill="#FFFFFF" stroke="#9A3412" stroke-width="1.6" />
  <circle cx="36" cy="38.5" r="5.5" fill="#18181B" />
  <!-- Crisp specular highlight dots -->
  <circle cx="33.8" cy="36" r="2.2" fill="#FFFFFF" />
  <circle cx="38.5" cy="41" r="1.1" fill="#FFFFFF" />

  <!-- Soft playful blush -->
  <ellipse cx="40" cy="48" rx="4.5" ry="2.5" fill="#FB7185" opacity="0.4" />

  <!-- Subtle mouth curve -->
  <path d="M24 46 Q 28 48 25 50" stroke="#9A3412" stroke-width="1.6" stroke-linecap="round" fill="none" />
</svg>
