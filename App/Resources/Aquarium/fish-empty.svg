<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="emptyFishBody" x1="20" y1="20" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="emptyFishFin" x1="75" y1="35" x2="115" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <!-- Quiet small question bubble -->
  <circle cx="26" cy="18" r="3" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1" opacity="0.7" />
  <circle cx="20" cy="26" r="1.8" fill="#E0F2FE" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />

  <!-- Soft aquatic pebble/bottom contour -->
  <ellipse cx="60" cy="74" rx="42" ry="6" fill="#CCFBF1" opacity="0.7" />
  <ellipse cx="40" cy="73" rx="14" ry="4" fill="#99F6E4" opacity="0.5" />

  <!-- Tail Fin (Caudal) - Calm resting pose -->
  <path d="M78 48 C 88 36, 105 30, 112 36 C 115 40, 106 48, 112 57 C 115 62, 109 70, 96 64 C 87 60, 81 54, 78 48 Z" fill="url(#emptyFishFin)" stroke="#EA580C" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Dorsal Fin (Top) -->
  <path d="M46 29 C 54 21, 67 22, 73 29 C 65 30, 56 31, 46 29 Z" fill="url(#emptyFishFin)" stroke="#EA580C" stroke-width="1.2" />

  <!-- Pelvic Fin (Bottom) -->
  <path d="M52 65 C 56 73, 67 74, 70 67 C 65 65, 58 64, 52 65 Z" fill="url(#emptyFishFin)" stroke="#EA580C" stroke-width="1.2" />

  <!-- Main Body Silhouette -->
  <path d="M24 46 C 24 31, 44 25, 68 28 C 83 30, 86 45, 84 52 C 80 63, 62 68, 44 66 C 29 65, 24 56, 24 46 Z" fill="url(#emptyFishBody)" stroke="#9A3412" stroke-width="1.8" />

  <!-- Warm Belly Curve -->
  <path d="M30 53 C 34 62, 52 66, 70 61 C 62 56, 42 52, 30 53 Z" fill="#FED7AA" opacity="0.9" />

  <!-- Pectoral Fin (Curious upward tilt) -->
  <path d="M44 48 C 42 55, 48 64, 58 64 C 61 63, 61 58, 57 54 C 54 51, 49 49, 44 48 Z" fill="#FDBA74" stroke="#EA580C" stroke-width="1.3" />

  <!-- Wide Curious Inquisitive Eye - Gazing slightly upward -->
  <ellipse cx="37" cy="38" rx="8.5" ry="9" fill="#FFFFFF" stroke="#9A3412" stroke-width="1.6" />
  <circle cx="36" cy="37" r="5.2" fill="#18181B" />
  <!-- Large sparkling highlight -->
  <circle cx="34.2" cy="34.8" r="2.2" fill="#FFFFFF" />
  <circle cx="38.5" cy="39" r="1.1" fill="#FFFFFF" />

  <!-- Cute little question blush -->
  <ellipse cx="40" cy="48" rx="4.5" ry="2.5" fill="#FB7185" opacity="0.35" />

  <!-- Curious mouth (little "o") -->
  <ellipse cx="25" cy="47" rx="1.5" ry="2" stroke="#9A3412" stroke-width="1.4" fill="none" />
</svg>
